<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Books</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#ece8df; --paper:#fbf8f1; --ink:#25231f; --soft:#6b665b; --line:rgba(37,35,31,.14); --accent:#7a3b2e; --accent-ink:#fff; --err:#b23a2a; --shadow:0 6px 22px rgba(37,35,31,.14); }
  @media (prefers-color-scheme: dark) { :root { --bg:#171614; --paper:#22201d; --ink:#ece8df; --soft:#a29c8f; --line:rgba(236,232,223,.16); --accent:#d98a77; --accent-ink:#1b0f0c; --err:#e5786a; --shadow:0 6px 22px rgba(0,0,0,.5); } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 22px 16px 60px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  h1 { margin:0; font-size:clamp(1.6rem,4.5vw,2.2rem); }
  .sub { margin:0 0 20px; color:var(--soft); }
  button, .btn { font:inherit; cursor:pointer; }
  .primary { padding:10px 16px; font-weight:700; background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px; }
  .btn { display:inline-block; padding:7px 12px; background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:8px; text-decoration:none; font-size:.9rem; }
  .btn:hover, .btn:focus-visible { border-color:var(--accent); outline:none; }
  .btn:disabled { opacity:.55; cursor:default; }
  .link { background:none; border:0; color:var(--soft); text-decoration:underline; padding:2px; font-size:.85rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr)); gap:16px; }
  .card { min-width:0; background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:16px; display:grid; gap:12px; align-content:start; }
  .head { display:grid; grid-template-columns:56px minmax(0,1fr); gap:12px; align-items:center; }
  .cover { width:56px; height:76px; border-radius:4px 8px 8px 4px; display:grid; place-items:center; font-size:26px; color:#fff; box-shadow:inset 4px 0 0 rgba(0,0,0,.18); }
  .title { font-weight:700; font-size:1.05rem; line-height:1.2; overflow-wrap:anywhere; }
  .author { color:var(--soft); font-size:.9rem; overflow-wrap:anywhere; }
  .notes { color:var(--soft); font-size:.88rem; margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .files { display:grid; gap:8px; }
  .file { min-width:0; display:grid; grid-template-columns:54px minmax(0,1fr); gap:8px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; }
  .file.empty { border-style:dashed; }
  .kind { font:700 .75rem ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.06em; color:var(--soft); }
  .meta { font-size:.8rem; color:var(--soft); overflow-wrap:anywhere; word-break:break-word; min-width:0; }
  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .foot { display:flex; gap:14px; }
  .empty-state { text-align:center; color:var(--soft); padding:50px 10px; }
  .msg { overflow-wrap:anywhere; margin:0 0 14px; padding:10px 12px; border-radius:10px; background:var(--paper); border:1px solid var(--line); font-size:.9rem; }
  .msg.err { color:var(--err); border-color:var(--err); }
  /* dialogs */
  .overlay { position:fixed; inset:0; background:rgba(10,10,10,.55); display:none; align-items:center; justify-content:center; padding:16px; z-index:60; }
  .overlay.open { display:flex; }
  form.dlg { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:22px; width:100%; max-width:420px; display:grid; gap:12px; }
  form.dlg h2 { margin:0; font-size:1.25rem; }
  label { font-size:.85rem; color:var(--soft); display:grid; gap:4px; }
  input[type=text], textarea { font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); width:100%; }
  .row { display:flex; gap:8px; justify-content:flex-end; }
  /* PDF reader */
  #reader { position:fixed; inset:0; z-index:70; background:#2b2a28; display:none; grid-template-rows:auto 1fr; color:#f1ede4; }
  #reader.open { display:grid; }
  .rbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 10px; background:#1d1c1a; padding-top:calc(8px + env(safe-area-inset-top,0px)); }
  .rbar .rt { flex:1; min-width:120px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rbar button, .rbar a { font:inherit; color:#f1ede4; background:rgba(255,255,255,.1); border:0; border-radius:8px; padding:7px 11px; text-decoration:none; cursor:pointer; }
  .rbar button:hover, .rbar a:hover { background:rgba(255,255,255,.2); }
  .rbar button:disabled { opacity:.4; cursor:default; }
  .rbar input { width:3.6em; text-align:center; font:inherit; padding:6px; border-radius:8px; border:0; background:rgba(255,255,255,.14); color:inherit; }
  .rbar .pg { white-space:nowrap; font-size:.9rem; }
  #stage { overflow:auto; padding:18px; text-align:center; -webkit-overflow-scrolling:touch; }
  #stage canvas { background:#fff; box-shadow:0 4px 24px rgba(0,0,0,.5); max-width:none; }
  #rmsg { padding:40px 10px; color:#cfc8b8; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>📚 My Books</h1>
    <button class="primary" id="addBook" type="button">Add book</button>
  </div>
  <p class="sub">The latest PDF, EPUB and KDP file of each book. Read PDFs here, or download any file.</p>
  <p class="msg" id="status" role="status" hidden></p>
  <div class="grid" id="grid"></div>
  <p class="empty-state" id="empty" hidden>No books yet. Click <b>Add book</b> to start your library.</p>
</main>

<div class="overlay" id="bookOverlay">
  <form class="dlg" id="bookForm">
    <h2 id="bookDlgTitle">Add book</h2>
    <label>Title <input type="text" id="bTitle" maxlength="200" required></label>
    <label>Author <input type="text" id="bAuthor" maxlength="160"></label>
    <label>Notes (for example the version or what changed) <textarea id="bNotes" rows="3" maxlength="2000"></textarea></label>
    <p class="msg err" id="bookErr" role="alert" hidden></p>
    <div class="row"><button type="button" class="btn" id="bookCancel">Cancel</button><button type="submit" class="primary" id="bookSave">Save</button></div>
  </form>
</div>

<div id="reader" role="dialog" aria-modal="true" aria-label="PDF reader">
  <div class="rbar">
    <button type="button" id="rClose" aria-label="Close reader">✕ Close</button>
    <span class="rt" id="rTitle"></span>
    <button type="button" id="rPrev" aria-label="Previous page">◀</button>
    <span class="pg"><input id="rPage" inputmode="numeric" aria-label="Page number"> / <span id="rCount">–</span></span>
    <button type="button" id="rNext" aria-label="Next page">▶</button>
    <button type="button" id="rOut" aria-label="Zoom out">−</button>
    <button type="button" id="rFit">Fit width</button>
    <button type="button" id="rIn" aria-label="Zoom in">+</button>
    <a id="rDownload" href="#" download>Download</a>
  </div>
  <div id="stage"><div id="rmsg">Loading…</div><canvas id="rCanvas" hidden></canvas></div>
</div>

<input type="file" id="fileIn" hidden>

<script src="lib/pdf.min.js"></script>
<script src="../cheapskate/local-api.js"></script>
<script src="../login.js"></script>
<script>
(function () {
  const api = window.localApi;
  const $ = id => document.getElementById(id);
  const KIND_LABEL = { pdf: 'PDF', epub: 'EPUB', kdp: 'KDP' };
  const KIND_HINT = { pdf: '.pdf', epub: '.epub', kdp: '' };  // KDP: any file (print PDF, cover, zip …)
  const COLORS = ['#7a3b2e', '#2f4858', '#2f6b41', '#8a5a00', '#5b3a7a', '#1f6b72'];
  let books = [];
  let editingId = null;
  let pendingUpload = null;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const size = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  const when = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  const colorOf = id => COLORS[Array.from(id).reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
  function status(msg, isErr) { const el = $('status'); if (!msg) { el.hidden = true; return; } el.textContent = msg; el.className = 'msg' + (isErr ? ' err' : ''); el.hidden = false; }

  function render() {
    $('empty').hidden = books.length > 0;
    $('grid').innerHTML = books.map(b => {
      const files = KIND_LABEL && ['pdf', 'epub', 'kdp'].map(k => {
        const f = b.files && b.files[k];
        if (!f) return `<div class="file empty"><span class="kind">${KIND_LABEL[k]}</span><div><div class="meta">Not added yet</div>
          <div class="acts"><button class="btn" data-act="upload" data-kind="${k}" data-id="${b.id}">Upload</button></div></div></div>`;
        return `<div class="file"><span class="kind">${KIND_LABEL[k]}</span><div>
          <div class="meta">${esc(f.name)} · ${size(f.size)} · ${when(f.at)}</div>
          <div class="acts">${k === 'pdf' ? `<button class="btn" data-act="read" data-id="${b.id}">Read</button>` : ''}
          <button class="btn" data-act="download" data-kind="${k}" data-id="${b.id}">Download</button>
          <button class="btn" data-act="upload" data-kind="${k}" data-id="${b.id}">New version</button>
          <button class="link" data-act="removefile" data-kind="${k}" data-id="${b.id}">Remove</button></div></div></div>`;
      }).join('');
      return `<article class="card"><div class="head"><div class="cover" style="background:${colorOf(b.id)}" aria-hidden="true">📖</div>
        <div><div class="title">${esc(b.title)}</div>${b.author ? `<div class="author">${esc(b.author)}</div>` : ''}
        <div class="meta">Updated ${when(b.updatedAt || b.createdAt)}</div></div></div>
        ${b.notes ? `<p class="notes">${esc(b.notes)}</p>` : ''}
        <div class="files">${files}</div>
        <div class="foot"><button class="link" data-act="edit" data-id="${b.id}">Edit details</button><button class="link" data-act="delete" data-id="${b.id}">Delete book</button></div></article>`;
    }).join('');
  }

  async function load() {
    try { books = await api.listBooks(); status(''); }
    catch (e) { status(e.message || 'Could not load your books.', true); books = []; }
    render();
  }

  // ----- add / edit book -----
  function openBookDialog(book) {
    editingId = book ? book.id : null;
    $('bookDlgTitle').textContent = book ? 'Edit details' : 'Add book';
    $('bTitle').value = book ? book.title : ''; $('bAuthor').value = book && book.author || ''; $('bNotes').value = book && book.notes || '';
    $('bookErr').hidden = true; $('bookOverlay').classList.add('open'); $('bTitle').focus();
  }
  $('addBook').addEventListener('click', () => openBookDialog(null));
  $('bookCancel').addEventListener('click', () => $('bookOverlay').classList.remove('open'));
  $('bookForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('bookSave').disabled = true;
    try {
      await api.saveBook({ id: editingId, title: $('bTitle').value, author: $('bAuthor').value, notes: $('bNotes').value });
      $('bookOverlay').classList.remove('open'); await load();
    } catch (err) { $('bookErr').textContent = err.message || 'Could not save.'; $('bookErr').hidden = false; }
    $('bookSave').disabled = false;
  });

  // ----- upload / download -----
  $('fileIn').addEventListener('change', async () => {
    const file = $('fileIn').files[0], job = pendingUpload; $('fileIn').value = '';
    if (!file || !job) return;
    status('Uploading ' + file.name + ' (' + size(file.size) + ')… this can take a minute for large files.');
    try { await api.uploadBookFile(job.id, job.kind, file); await load(); status('Uploaded ' + file.name + '.'); }
    catch (err) { status(err.message || 'Upload failed.', true); }
  });
  function saveBlob(blob, name) {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  $('grid').addEventListener('click', async e => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const book = books.find(b => b.id === btn.dataset.id), kind = btn.dataset.kind, act = btn.dataset.act;
    if (!book) return;
    try {
      if (act === 'upload') {
        pendingUpload = { id: book.id, kind };
        $('fileIn').accept = KIND_HINT[kind]; $('fileIn').click();
      } else if (act === 'download') {
        btn.disabled = true; status('Downloading…');
        try { saveBlob(await api.getBookFile(book.files[kind].path), book.files[kind].name); status(''); } finally { btn.disabled = false; }
      } else if (act === 'read') {
        openReader(book);
      } else if (act === 'removefile') {
        if (!confirm('Remove the ' + KIND_LABEL[kind] + ' file of "' + book.title + '"?')) return;
        await api.deleteBookFile(book.id, kind); await load();
      } else if (act === 'edit') {
        openBookDialog(book);
      } else if (act === 'delete') {
        if (!confirm('Delete "' + book.title + '" and all its files?')) return;
        status('Deleting…'); await api.deleteBook(book.id); await load();
      }
    } catch (err) { status(err.message || 'Something went wrong.', true); }
  });

  // ----- PDF reader -----
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
  const R = { doc: null, page: 1, zoom: 1, fit: true, task: null, token: 0, blobUrl: null };
  async function openReader(book) {
    const f = book.files.pdf;
    $('rTitle').textContent = book.title; $('reader').classList.add('open');
    $('rmsg').hidden = false; $('rmsg').textContent = 'Loading…'; $('rCanvas').hidden = true; $('rCount').textContent = '–';
    document.documentElement.style.overflow = 'hidden';
    R.doc = null; R.page = 1; R.zoom = 1; R.fit = true;
    try {
      const blob = await api.getBookFile(f.path);
      if (R.blobUrl) URL.revokeObjectURL(R.blobUrl);
      R.blobUrl = URL.createObjectURL(blob);
      $('rDownload').href = R.blobUrl; $('rDownload').download = f.name;
      R.doc = await pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
      $('rCount').textContent = R.doc.numPages;
      $('rmsg').hidden = true; $('rCanvas').hidden = false;
      await renderPage();
    } catch (err) { $('rmsg').hidden = false; $('rmsg').textContent = err.message || 'Could not open this PDF.'; }
  }
  function closeReader() {
    $('reader').classList.remove('open'); document.documentElement.style.overflow = '';
    if (R.task) { try { R.task.cancel(); } catch (e) { /* ignore */ } }
    R.doc = null;
  }
  async function renderPage() {
    if (!R.doc) return;
    const mine = ++R.token;
    R.page = Math.min(Math.max(1, R.page), R.doc.numPages);
    $('rPage').value = R.page;
    $('rPrev').disabled = R.page <= 1; $('rNext').disabled = R.page >= R.doc.numPages;
    const page = await R.doc.getPage(R.page);
    const base = page.getViewport({ scale: 1 });
    const avail = Math.max(200, $('stage').clientWidth - 36);
    const scale = (R.fit ? avail / base.width : 1.2) * R.zoom;
    const vp = page.getViewport({ scale });
    const dpr = window.devicePixelRatio || 1, canvas = $('rCanvas');
    if (R.task) { try { R.task.cancel(); } catch (e) { /* ignore */ } }
    if (mine !== R.token) return;
    canvas.width = Math.floor(vp.width * dpr); canvas.height = Math.floor(vp.height * dpr);
    canvas.style.width = Math.floor(vp.width) + 'px'; canvas.style.height = Math.floor(vp.height) + 'px';
    R.task = page.render({ canvasContext: canvas.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null });
    try { await R.task.promise; } catch (e) { /* cancelled by a newer render */ }
    if (mine === R.token) $('stage').scrollTop = 0;
  }
  const go = n => { R.page = n; renderPage(); };
  $('rClose').addEventListener('click', closeReader);
  $('rPrev').addEventListener('click', () => go(R.page - 1));
  $('rNext').addEventListener('click', () => go(R.page + 1));
  $('rPage').addEventListener('change', () => go(parseInt($('rPage').value, 10) || R.page));
  $('rIn').addEventListener('click', () => { R.zoom = Math.min(4, R.zoom * 1.25); renderPage(); });
  $('rOut').addEventListener('click', () => { R.zoom = Math.max(0.3, R.zoom / 1.25); renderPage(); });
  $('rFit').addEventListener('click', () => { R.fit = true; R.zoom = 1; renderPage(); });
  window.addEventListener('resize', () => { if ($('reader').classList.contains('open')) renderPage(); });
  document.addEventListener('keydown', e => {
    if (!$('reader').classList.contains('open') || e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape') closeReader();
    else if (e.key === 'ArrowRight' || e.key === 'PageDown') go(R.page + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(R.page - 1);
    else if (e.key === '+' || e.key === '=') $('rIn').click();
    else if (e.key === '-') $('rOut').click();
  });

  if (api.syncing()) load();
})();
</script>
</body>
</html>
